name: Build Kivy Android APK (Fixed Signature)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # ──────────────────────────────────────
    # 1. 检出代码
    # ──────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4

    # ──────────────────────────────────────
    # 2. 安装 JDK 17
    # ──────────────────────────────────────
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ──────────────────────────────────────
    # 3. 安装 Python 3.9
    # ──────────────────────────────────────
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # ──────────────────────────────────────
    # 4. 安装系统级依赖
    # ──────────────────────────────────────
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl unzip openjdk-17-jdk libltdl-dev

    # ──────────────────────────────────────
    # 5. 安装 Buildozer / Cython / Kivy
    # ──────────────────────────────────────
    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy kivymd
        pip install python-for-android

    # ──────────────────────────────────────
    # 6. ★ 还原固定 debug keystore（签名不变的核心）
    # ──────────────────────────────────────
    - name: Restore fixed debug keystore
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
        ls -la ~/.android/debug.keystore

    # ──────────────────────────────────────
    # 7. 构建 APK
    # ──────────────────────────────────────
    - name: Build APK with Buildozer
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        echo "=== Environment Check ==="
        java -version
        python --version
        buildozer --version

        # 解决网络问题
        export BUILDODER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0

        # 开始构建
        buildozer -v android debug 2>&1 | tee buildozer.log

        # 复制 APK 到根目录方便后续步骤使用
        find . -name "*.apk" -exec cp {} ./ \; 2>/dev/null || true

    # ──────────────────────────────────────
    # 8. 检查 APK 是否构建成功
    # ──────────────────────────────────────
    - name: Check if APK was built
      id: check-build
      run: |
        if ls *.apk 1> /dev/null 2>&1; then
          echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
          echo "=== Found APK files ==="
          ls -la *.apk
        else
          echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
          echo "No APK files found."
        fi

    # ──────────────────────────────────────
    # 9. 验证签名一致性
    # ──────────────────────────────────────
    - name: Verify APK signature
      if: steps.check-build.outputs.BUILD_FINAL_SUCCESS == 'true'
      run: |
        echo "=== APK Signature Info ==="
        keytool -printcert -jarfile *.apk || true
        echo ""
        echo "=== APK Checksum ==="
        sha256sum *.apk

    # ──────────────────────────────────────
    # 10. 上传 APK 产物
    # ──────────────────────────────────────
    - name: Upload APK artifact
      if: steps.check-build.outputs.BUILD_FINAL_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kivy-app-apk
        path: |
          *.apk
          bin/*.apk
        retention-days: 30

    # ──────────────────────────────────────
    # 11. 上传构建日志（无论成功失败）
    # ──────────────────────────────────────
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          buildozer.log
        retention-days: 7
