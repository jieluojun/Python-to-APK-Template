name: Build Kivy Android APK (Fixed Signature + Verified)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # ──────────────────────────────────────
    # 1. 检出代码
    # ──────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4

    # ──────────────────────────────────────
    # 2. 安装 JDK 17
    # ──────────────────────────────────────
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ──────────────────────────────────────
    # 3. 安装 Python 3.9
    # ──────────────────────────────────────
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # ──────────────────────────────────────
    # 4. 安装系统级依赖
    # ──────────────────────────────────────
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl unzip openjdk-17-jdk libltdl-dev

    # ──────────────────────────────────────
    # 5. 安装 Buildozer / Cython / Kivy
    # ──────────────────────────────────────
    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy kivymd
        pip install python-for-android

    # ──────────────────────────────────────
    # 6. ★ 还原固定 keystore + 校验指纹
    # ──────────────────────────────────────
    - name: Restore and verify fixed debug keystore
      run: |
        mkdir -p ~/.android

        # 检查 Secret 是否配置
        if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
          echo "❌ ERROR: DEBUG_KEYSTORE_BASE64 secret is NOT set!"
          echo "Go to Settings → Secrets and variables → Actions → New secret"
          echo "Name: DEBUG_KEYSTORE_BASE64"
          echo "Value: $(base64 debug.keystore output)"
          exit 1
        fi

        # 还原 keystore
        echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

        # 校验文件有效
        if [ ! -s ~/.android/debug.keystore ]; then
          echo "❌ ERROR: debug.keystore is empty!"
          exit 1
        fi

        echo "✅ Keystore restored successfully"
        ls -la ~/.android/debug.keystore

        # ★ 打印 SHA1 指纹（每次构建对比这个值是否一致）
        echo ""
        echo "=== 🔑 Keystore SHA1 Fingerprint ==="
        keytool -list -v \
          -keystore ~/.android/debug.keystore \
          -storepass android \
          -keypass android \
          -alias androiddebugkey 2>&1 | grep -E "SHA1|SHA256|Alias name"

    # ──────────────────────────────────────
    # 7. 构建 APK
    # ──────────────────────────────────────
    - name: Build APK with Buildozer
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        echo "=== Environment Check ==="
        java -version
        python --version
        buildozer --version

        export BUILDODER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0

        # 干净构建
        buildozer -v android clean 2>&1 | tee clean.log
        buildozer -v android update 2>&1 | tee update.log
        buildozer -v android debug 2>&1 | tee buildozer.log

    # ──────────────────────────────────────
    # 8. 校验：只保留一个 APK + 打印哈希
    # ──────────────────────────────────────
    - name: Verify single APK output
      id: verify-apk
      run: |
        echo "=== bin/ contents ==="
        ls -lh bin/

        apk_count=$(find bin -name "*.apk" -type f | wc -l)
        echo "APK count: $apk_count"

        if [ "$apk_count" -eq 0 ]; then
          echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
          echo "❌ No APK found!"
          exit 1
        elif [ "$apk_count" -gt 1 ]; then
          echo "⚠️ Multiple APKs, keeping latest only"
          cd bin && ls -t *.apk | tail -n +2 | xargs rm -f && cd ..
        fi

        echo "=== Final APK ==="
        ls -lh bin/*.apk
        echo ""
        echo "=== APK SHA256 ==="
        sha256sum bin/*.apk

        echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT

    # ──────────────────────────────────────
    # 9. ★ 验证 APK 签名（对比 keystore 指纹）
    # ──────────────────────────────────────
    - name: Verify APK signature matches keystore
      if: steps.verify-apk.outputs.BUILD_FINAL_SUCCESS == 'true'
      run: |
        echo "=== APK signing certificate ==="
        keytool -printcert -jarfile bin/*.apk 2>&1 | grep -E "SHA1|S
