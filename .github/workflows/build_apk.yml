name: Build Kivy Android APK (Single APK + Fixed Signature)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # ──────────────────────────────────────
    # 1. 检出代码
    # ──────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4

    # ──────────────────────────────────────
    # 2. 安装 JDK 17
    # ──────────────────────────────────────
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ──────────────────────────────────────
    # 3. 安装 Python 3.9
    # ──────────────────────────────────────
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # ──────────────────────────────────────
    # 4. 安装系统级依赖
    # ──────────────────────────────────────
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl unzip openjdk-17-jdk libltdl-dev

    # ──────────────────────────────────────
    # 5. 安装 Buildozer / Cython / Kivy
    # ──────────────────────────────────────
    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy kivymd
        pip install python-for-android

    # ──────────────────────────────────────
    # 6. ★ 还原固定 debug keystore（签名不变的核心）
    # ──────────────────────────────────────
    - name: Restore fixed debug keystore
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
        ls -la ~/.android/debug.keystore

    # ──────────────────────────────────────
    # 7. 构建 APK（clean → update → debug）
    # ──────────────────────────────────────
    - name: Build APK with Buildozer
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        echo "=== Environment Check ==="
        java -version
        python --version
        buildozer --version

        # 解决网络问题
        export BUILDODER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0

        # 清理旧构建缓存，确保每次都是干净构建
        buildozer -v android clean 2>&1 | tee clean.log
        buildozer -v android update 2>&1 | tee update.log

        # 开始构建
        buildozer -v android debug 2>&1 | tee buildozer.log

    # ──────────────────────────────────────
    # 8. ★ 校验：只保留一个 APK
    # ──────────────────────────────────────
    - name: Verify single APK output
      id: verify-apk
      run: |
        echo "=== bin/ directory contents ==="
        ls -lh bin/

        # 统计 APK 数量
        apk_count=$(find bin -name "*.apk" -type f | wc -l)
        echo "APK count: $apk_count"

        if [ "$apk_count" -eq 0 ]; then
          echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
          echo "❌ No APK found in bin/"
          exit 1
        elif [ "$apk_count" -eq 1 ]; then
          echo "✅ Exactly one APK found (expected)"
        else
          echo "⚠️ Multiple APKs found ($apk_count), keeping only the latest"
          # 只保留最新的一个，删除其余
          cd bin
          ls -t *.apk | tail -n +2 | xargs rm -f
          cd ..
          echo "After cleanup:"
          ls -lh bin/
        fi

        # 打印哈希值用于校验
        echo "=== APK SHA256 ==="
        sha256sum bin/*.apk

        echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT

    # ──────────────────────────────────────
    # 9. 验证签名信息
    # ──────────────────────────────────────
    - name: Verify APK signature
      if: steps.verify-apk.outputs.BUILD_FINAL_SUCCESS == 'true'
      run: |
        echo "=== APK Signature Info ==="
        keytool -printcert -jarfile bin/*.apk || true

    # ──────────────────────────────────────
    # 10. 上传唯一 APK
    # ──────────────────────────────────────
    - name: Upload APK artifact
      if: steps.verify-apk.outputs.BUILD_FINAL_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kivy-app-apk
        path: bin/*.apk
        retention-days: 30

    # ──────────────────────────────────────
    # 11. 上传构建日志（无论成功失败）
    # ──────────────────────────────────────
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          buildozer.log
          clean.log
          update.log
        retention-days: 7
