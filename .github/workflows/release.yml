name: Build LanPlay Monitor APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ===== 1. 拉取代码 =====
    - name: Checkout
      uses: actions/checkout@v4

    # ===== 2. Java 17 =====
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ===== 3. Python 3.10 =====
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ===== 4. 系统依赖 =====
    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip curl \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev cmake \
            libffi-dev libssl-dev pngquant

    # ===== 5. 安装 p4a（不用 Buildozer！）=====
    - name: Install p4a
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.1"
        pip install python-for-android==2024.1.21
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # ===== 6. 生成签名 Keystore =====
    - name: Generate keystore
      id: key
      run: |
        keytool -genkey -v \
          -keystore com.lanplay.monitor.keystore \
          -alias com.lanplay.monitor \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=LanPlay, OU=Monitor, O=LanPlay"
        echo "KEY_CREATED=true" >> $GITHUB_OUTPUT

    # ===== 7. 清理 =====
    - name: Clean
      run: |
        rm -rf .buildozer bin/ dist/ *.apk
        mkdir -p bin
        p4a clean_builds 2>/dev/null || true
        p4a clean_dists 2>/dev/null || true

    # ===== 8. 用 p4a 直接构建 APK =====
    - name: Build APK
      id: build_apk
      run: |
        export PATH="$HOME/.local/bin:$PATH"

        echo "=== p4a version ==="
        p4a --version

        echo "=== Building APK ==="
        # 直接用 p4a apk 命令，不通过 buildozer
        # 这样完全绕过 AAB 检测
        p4a \
          --storage-dir=.buildozer \
          apk \
          --requirements=python3,flask,jinja2,markupsafe,werkzeug,itsdangerous,click,pyjnius,libiconv,libffi \
          --private=. \
          --package=com.lanplay.monitor \
          --name=LanPlayMonitor \
          --version=1.0.0 \
          --orientation=portrait \
          --permission=INTERNET \
          --window \
          --enable-androidx \
          --android-api=33 \
          --ndk=25b \
          --arch=arm64-v8a \
          --arch=armeabi-v7a \
          2>&1 | tee build.log

        echo "=== Looking for APK ==="
        find .buildozer -name "*.apk" -type f | while read f; do
          echo "✅ Found: $f ($(du -h "$f" | cut -f1))"
          cp "$f" "bin/$(basename "$f")"
        done

        # 也检查当前目录
        find . -maxdepth 2 -name "*.apk" -type f | while read f; do
          echo "✅ Found: $f"
          cp "$f" "bin/$(basename "$f")"
        done

        if [ -z "$(ls -A bin/ 2>/dev/null)" ]; then
          echo "❌ No APK generated!"
          echo "=== .buildozer tree ==="
          find .buildozer -type f 2>/dev/null | head -50
          echo "=== build.log tail ==="
          tail -80 build.log
          exit 1
        fi

        echo "=== bin/ ==="
        ls -lh bin/

    # ===== 9. 签名 APK =====
    - name: Sign APK
      run: |
        APK=$(ls -t bin/*.apk 2>/dev/null | head -1)
        if [ -z "$APK" ]; then
          echo "❌ No APK to sign!"
          exit 1
        fi

        echo "Signing: $APK"

        # 找 build-tools
        SDK="/usr/local/lib/android/sdk"
        BT=$(ls -d $SDK/build-tools/*/ 2>/dev/null | sort | tail -1)

        if [ -n "$BT" ] && [ -f "$BT/zipalign" ] && [ -f "$BT/apksigner" ]; then
          ALIGNED="bin/LanPlayMonitor-aligned.apk"
          SIGNED="bin/LanPlayMonitor-1.0.0-release.apk"
          "$BT/zipalign" -v 4 "$APK" "$ALIGNED" 2>&1 || cp "$APK" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$PWD/com.lanplay.monitor.keystore" \
            --ks-key-alias "com.lanplay.monitor" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" "$ALIGNED" 2>&1
          echo "✅ Signed: $SIGNED"
        else
          echo "⚠️ No build-tools found, APK left unsigned"
          ls -lh bin/
        fi

    # ===== 10. 上传 APK =====
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kivy-android-apk
        path: bin/*.apk
        retention-days: 30

    # ===== 11. 上传 Keystore =====
    - name: Upload keystore
      if: steps.key.outputs.KEY_CREATED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: android-keystore
        path: com.lanplay.monitor.keystore
        retention-days: 1

    # ===== 12. 上传日志 =====
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
        retention-days: 7
