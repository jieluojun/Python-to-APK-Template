name: Build Kivy Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java.home=/usr/lib/jvm/temurin-17-jdk-amd64 -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-22.04  # ✅ 比 ubuntu-latest 更轻量、更快

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ✅ 缓存 pip 下载的包，第二次构建快 2-3 分钟
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # ✅ 缓存 Buildozer 下载的 SDK/NDK/Gradle（最大加速点）
    - name: Cache Buildozer downloads
      uses: actions/cache@v4
      with:
        path: |
          .buildozer/android/platform
          .buildozer/android/packages
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git zip unzip \
          openjdk-17-jdk \
          autoconf automake libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          python3-pip curl \
          libcairo2-dev \
          libgirepository1.0-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          ffmpeg 2>&1 | tail -5

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install Cython==0.29.33 buildozer python-for-android
        pip install kivy[base]==2.3.0
        pip install https://github.com/kivymd/KivyMD/archive/master.zip

    - name: Create signing keystore (if not exists)
      run: |
        if [ ! -f "com.lanplay.monitor.keystore" ]; then
          keytool -genkeypair \
            -keystore com.lanplay.monitor.keystore \
            -alias com.lanplay.monitor \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=LanPlay, OU=Release, O=LAN, L=Unknown, ST=Unknown, C=US"
        fi

    - name: Build Release APK
      run: |
        export BUILDOZER_ALLOW_PLATFORM_EXEC=1
        buildozer -v android release 2>&1 | tee buildozer.log

    - name: Find generated APK
      id: apk
      run: |
        mkdir -p output
        APK=$(find .buildozer -name "*-release.apk" | head -n 1)
        if [ -z "$APK" ]; then
          echo "❌ APK not found, checking bin/..."
          ls -la bin/ 2>/dev/null || true
          ls -la .buildozer/android/platform/build-*/dists/*/ 2>/dev/null || true
          exit 1
        fi
        cp "$APK" output/LanPlayMonitor-release.apk
        echo "APK_PATH=output/LanPlayMonitor-release.apk" >> $GITHUB_OUTPUT
        echo "✅ APK size: $(du -h "$APK" | cut -f1)"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LanPlayMonitor-Release-APK
        path: ${{ steps.apk.outputs.APK_PATH }}
        retention-days: 30

    - name: Upload build logs (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-logs
        path: |
          buildozer.log
          .buildozer/android/platform/build-*/
        retention-days: 7
