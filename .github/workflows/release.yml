name: release
on: workflow_dispatch

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl unzip openjdk-17-jdk libltdl-dev

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy kivymd
          # 确保 buildozer 在 PATH 中
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ✅ 新增：强制清理旧的构建缓存（关键！）
      - name: Clean previous builds
        run: |
          echo "Cleaning old builds..."
          rm -rf .buildozer bin/*.apk bin/*.aab
          buildozer android clean || true

      # ✅ 新增：先跑 Debug 模式保底（最稳定，一定能出包）
      - name: Build Debug APK (Stable Fallback)
        run: |
          echo "Building Debug APK (Stable Mode)..."
          buildozer -v android debug
          echo "Debug build finished."
          ls -l bin/*.apk # 打印出来看看有没有

      # ✅ 新增：如果 Debug 成功，再尝试 Release 模式（带体积优化）
      - name: Build Release APK (Optimized)
        if: success()
        run: |
          echo "Building Release APK (Optimized)..."
          # 确保配置是 APK 模式
          sed -i 's/android.release = True/android.aab = False/' buildozer.spec
          buildozer -v android release
          echo "Release build finished."
          ls -l bin/*.apk # 打印出来看看有没有

      # ✅ 上传产物
      - name: Upload APK artifact
        if: success() || failure() # 即使失败也上传，方便查日志
        uses: actions/upload-artifact@v4
        with:
          name: kivy-app-build
          path: bin/*.apk
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            buildozer.log
            .buildozer/android/platform/build-*/**/buildozer.log
          retention-days: 3
