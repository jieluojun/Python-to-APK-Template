name: Build Kivy Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    # ===== 1. 拉取代码 =====
    - name: Checkout code
      uses: actions/checkout@v4

    # ===== 2. Java 17 =====
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ===== 3. 安装系统依赖 =====
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip curl \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev cmake \
            libffi-dev libssl-dev pngquant

    # ===== 4. 安装 Buildozer（仅用于配置管理）=====
    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.5.0
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # ===== 5. 生成签名 Keystore =====
    - name: Generate signing key
      id: generate_key
      run: |
        KEYSTORE="com.lanplay.monitor.keystore"
        ALIAS="com.lanplay.monitor"
        if [ ! -f "$KEYSTORE" ]; then
          keytool -genkey -v \
            -keystore "$KEYSTORE" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=LanPlay, OU=Monitor, O=LanPlay, L=Unknown, ST=Unknown, C=Unknown"
          echo "KEY_CREATED=true" >> $GITHUB_OUTPUT
        else
          echo "KEY_CREATED=false" >> $GITHUB_OUTPUT
        fi

    # ===== 6. 清理缓存 =====
    - name: Clean old builds
      run: |
        rm -rf .buildozer bin/
        buildozer android clean 2>&1 || true

    # ===== 7. 用 Docker 构建 APK（核心步骤）=====
    # p4a 官方 Docker 镜像，预装了所有兼容版本
    - name: Build APK with p4a Docker
      run: |
        # 拉取 p4a 官方 Docker 镜像（含 Python 3.10 + NDK r25b + SDK 33）
        docker pull kivy/python-for-android:latest

        # 创建输出目录
        mkdir -p bin

        # 用 Docker 运行 p4a 构建
        # 将当前目录挂载到容器中
        docker run --rm \
          -v "$PWD":/home/user/app \
          -w /home/user/app \
          -e ANDROID_SDK_ROOT=/opt/android-sdk \
          -e ANDROID_HOME=/opt/android-sdk \
          kivy/python-for-android:latest \
          bash -c "
            # 安装应用依赖
            pip install kivy==2.3.0 pyjnius==1.4.2 --no-deps || true

            # 生成签名
            keytool -genkey -v \
              -keystore com.lanplay.monitor.keystore \
              -alias com.lanplay.monitor \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname 'CN=LanPlay, OU=Monitor, O=LanPlay'

            # 用 buildozer 构建 release APK
            buildozer android release 2>&1 | tee release.log

            # 列出生成的文件
            echo '=== Files generated ==='
            find . -name '*.apk' -type f
          "

        echo "=== Host files ==="
        find . -name "*.apk" -type f
        ls -lh bin/ 2>/dev/null || true

    # ===== 8. 查找并复制 APK =====
    - name: Find and copy APK
      id: find-apk
      run: |
        echo "=== Searching for APK ==="
        find . -name "*.apk" -type f 2>/dev/null | while read f; do
          echo "Found: $f ($(du -h "$f" | cut -f1))"
          mkdir -p bin
          cp "$f" "bin/$(basename "$f")"
        done

        if [ ! -d "bin" ] || [ -z "$(ls -A bin/ 2>/dev/null)" ]; then
          echo "❌ Still no APK found!"
          echo "=== Full .buildozer tree ==="
          find .buildozer -type f 2>/dev/null | head -50
          echo "=== release.log tail ==="
          tail -100 release.log 2>/dev/null || true
          exit 1
        fi

        echo "✅ APK ready in bin/:"
        ls -lh bin/

    # ===== 9. 签名 APK =====
    - name: Sign APK
      run: |
        APK=$(ls -t bin/*.apk 2>/dev/null | head -1)
        if [ -n "$APK" ] && [[ "$APK" == *"unsigned"* ]]; then
          echo "Signing $APK..."
          ZIPALIGN=$(find /usr/local/lib/android/sdk/build-tools -name "zipalign" 2>/dev/null | sort | tail -1)
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" 2>/dev/null | sort | tail -1)
          if [ -n "$ZIPALIGN" ] && [ -n "$APKSIGNER" ]; then
            ALIGNED="bin/LanPlayMonitor-aligned.apk"
            SIGNED="bin/LanPlayMonitor-1.0.0-release.apk"
            "$ZIPALIGN" -v 4 "$APK" "$ALIGNED"
            "$APKSIGNER" sign \
              --ks "$PWD/com.lanplay.monitor.keystore" \
              --ks-key-alias "com.lanplay.monitor" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$SIGNED" "$ALIGNED"
            echo "✅ Signed: $SIGNED"
          else
            echo "⚠️ zipalign/apksigner not found, skipping sign"
          fi
        fi
        ls -lh bin/

    # ===== 10. 上传 APK =====
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kivy-android-apk
        path: bin/*.apk
        retention-days: 30

    # ===== 11. 上传 Keystore =====
    - name: Upload keystore
      if: steps.generate_key.outputs.KEY_CREATED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: android-keystore
        path: com.lanplay.monitor.keystore
        retention-days: 1

    # ===== 12. 上传日志 =====
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          release.log
        retention-days: 7
