name: Build Kivy Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip ant \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl unzip openjdk-17-jdk libltdl-dev

    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy kivymd
        pip install python-for-android

    - name: Build APK with Buildozer
      env:
        # 将密码正确映射为 python-for-android (p4a) 的标准 Release 签名环境变量
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_STOREPASS }}
        P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEYSTORE_KEYPASS }}
        # 如果你配置了 keystore 路径和 alias，也可以在此处指定：
        # P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/your_keystore.jks
        # P4A_RELEASE_KEYALIAS: your_alias
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        echo "Let's have a check:"
        java -version
        python --version
        buildozer --version
 
        export BUILDODER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0
 
        # 提示：如果你目前只是想测试生成 APK，建议临时将 "release" 改为 "debug"（debug 不需要配置复杂的签名密钥）
        # buildozer -v android debug
        
        # 运行构建，如果失败则直接打印最后 100 行日志到控制台以便排查
        buildozer -v android release 2>&1 | tee buildozer.log || {
          echo "=== Build failed! Printing last 100 lines of buildozer.log ==="
          tail -n 100 buildozer.log
          exit 1
        }
 
        # 查找所有编译出的 apk 或 aab 并复制到根目录
        find . -name "*.apk" -exec cp {} ./ \; 2>/dev/null || true
        find . -name "*.aab" -exec cp {} ./ \; 2>/dev/null || true

    - name: Check if APK/AAB was built
      id: check-build
      run: |
        if ls *.apk 1> /dev/null 2>&1 || ls *.aab 1> /dev/null 2>&1; then
          echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
          echo "找到构建文件:"
          ls -la *.apk *.aab 2>/dev/null || true
        else
          echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
          echo "未找到构建文件，检查 buildozer.log 末尾："
          if [ -f "buildozer.log" ]; then
            tail -n 50 buildozer.log
          fi
          exit 1
        fi

    - name: Upload APK/AAB artifact
      if: steps.check-build.outputs.BUILD_FINAL_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kivy-app-build
        path: |
          bin/*
          *.apk
          *.aab
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          buildozer.log
        retention-days: 7
