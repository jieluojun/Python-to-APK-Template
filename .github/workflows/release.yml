name: Build Kivy Android APK (Release)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java.home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get remove -y openjdk* || true
        sudo apt-get install -y \
          git zip unzip \
          python3-pip autoconf automake libtool \
          pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev \
          curl libltdl-dev

    - name: Install Buildozer and Python deps
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy python-for-android

    - name: Decode signing key from Base64
      run: |
        echo "Decoding keystore..."
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 -d > $HOME/keystore.jks

    - name: Verify keystore
      run: |
        keytool -list -v \
          -keystore $HOME/keystore.jks \
          -storepass ${{ secrets.RELEASE_KEYSTORE_PASSWD }} \
          -alias ${{ secrets.RELEASE_KEYALIAS }}

    - name: Prepare Android signing env
      run: |
        echo "P4A_RELEASE_KEYSTORE=$HOME/keystore.jks" >> $GITHUB_ENV
        echo "P4A_RELEASE_KEYALIAS=${{ secrets.RELEASE_KEYALIAS }}" >> $GITHUB_ENV
        echo "P4A_RELEASE_KEYSTORE_PASSWD=${{ secrets.RELEASE_KEYSTORE_PASSWD }}" >> $GITHUB_ENV
        echo "P4A_RELEASE_KEYALIAS_PASSWD=${{ secrets.RELEASE_KEYALIAS_PASSWD }}" >> $GITHUB_ENV

    - name: Build APK with Buildozer (Release)
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        export BUILDOZER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0

        echo "=== Environment Check ==="
        java -version
        python --version
        buildozer --version

        buildozer -v android release 2>&1 | tee buildozer.log

    - name: Locate APK (Fixed)
      id: find-apk
      run: |
        mkdir -p apk-out

        # ✅ 优先在 bin/ 目录查找 release APK（Buildozer 实际输出位置）
        APK=$(find ./bin -maxdepth 1 -name "*release.apk" | head -n 1)

        if [ -z "$APK" ]; then
          echo "❌ APK not found in ./bin"
          ls -R ./bin || true
          echo "APK_NOT_FOUND=true" >> $GITHUB_OUTPUT
          exit 1
        fi

        cp "$APK" apk-out/
        echo "✅ Found APK: $APK"
        echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
        echo "APK_NAME=$(basename $APK)" >> $GITHUB_OUTPUT

    - name: Upload APK artifact
      if: steps.find-apk.outputs.APK_NAME != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.find-apk.outputs.APK_NAME }}
        path: apk-out/*.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-logs
        path: buildozer.log
        retention-days: 7
