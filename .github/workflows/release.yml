name: Build Kivy Android APK (Release)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java.home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          python3-pip autoconf automake libtool \
          pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev \
          curl openjdk-17-jdk libltdl-dev

    - name: Install Buildozer and Python deps
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy python-for-android

    - name: Decode signing key
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 -d > /home/runner/keystore.jks
    
    - name: Prepare Android signing env
      run: |
        echo "ENV_RELEASE_KEYALIAS=${{ secrets.RELEASE_KEYALIAS }}" >> $GITHUB_ENV
        echo "ENV_RELEASE_KEYSTORE_PASSWD=${{ secrets.RELEASE_KEYSTORE_PASSWD }}" >> $GITHUB_ENV
        echo "ENV_RELEASE_KEYALIAS_PASSWD=${{ secrets.RELEASE_KEYALIAS_PASSWD }}" >> $GITHUB_ENV

    - name: Build APK with Buildozer (Release)
      run: |
        export PATH="$HOME/.local/bin:$PATH"

        echo "=== Environment Check ==="
        java -version
        python --version
        buildozer --version

        # 修复你原文件里的拼写错误
        export BUILDOZER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0

        # 明确禁用 AAB（与你 spec 保持一致）
        export BUILDOZER_ANDROID_AAB=False

        buildozer -v android release 2>&1 | tee buildozer.log

    - name: Locate and upload APK
      if: always()
      run: |
        mkdir -p apk-out

        APK=$(find ./bin -maxdepth 1 -name "*release.apk" | head -n 1)

        if [ -z "$APK" ]; then
          echo "❌ APK not found"
          ls -R ./bin || true
        else
          cp "$APK" apk-out/
          echo "✅ APK ready: $(basename $APK)"
        fi

    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LanPlay-Monitor-Release-APK
        path: apk-out/
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-logs
        path: buildozer.log
        retention-days: 7
