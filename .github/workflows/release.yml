name: Build Kivy Android APK In Release Mode

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          python3-pip autoconf automake libtool \
          pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev \
          curl openjdk-17-jdk libltdl-dev patchelf \
          lld ninja-build

    - name: Install Buildozer and locked deps
      run: |
        python -m pip install --upgrade pip
        pip install cython==0.29.33
        pip install "kivy==2.2.1" "kivymd==1.1.5"
        pip install buildozer python-for-android

    - name: Generate signing key (if not exists)
      run: |
        if [ ! -f "com.lanplay.monitor.keystore" ]; then
          echo "Creating new keystore..."
          keytool -genkey -v \
            -keystore com.lanplay.monitor.keystore \
            -alias com.lanplay.monitor \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWD }}" \
            -keypass "${{ secrets.KEYALIAS_PASSWD }}" \
            -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"
        else
          echo "Using existing keystore."
        fi

    - name: Build APK with Buildozer (Release)
      run: |
        set -e
        export PATH="$HOME/.local/bin:$PATH"
        export BUILDOZER_ALLOW_PLATFORM_EXEC=1   # ✅ 修正拼写
        export USE_COLORS=0

        export P4A_RELEASE_KEYSTORE="$PWD/com.lanplay.monitor.keystore"
        export P4A_RELEASE_KEYALIAS="com.lanplay.monitor"
        export P4A_RELEASE_KEYSTORE_PASSWD="${{ secrets.KEYSTORE_PASSWD }}"
        export P4A_RELEASE_KEYALIAS_PASSWD="${{ secrets.KEYALIAS_PASSWD }}"

        # 清理 + 明确指定 arch，减少坑
        buildozer android clean
        buildozer -v android release

        echo "=== APK search ==="
        find .buildozer -name "*.apk" | tee apk_list.txt

        # ✅ 强制失败：没 APK 就红
        if [ ! -s apk_list.txt ]; then
          echo "::error::No APK generated"
          exit 1
        fi

    - name: Copy APK to bin/
      run: |
        mkdir -p bin
        find .buildozer -name "*.apk" -exec cp {} bin/ \;

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: kivy-app-release-apk
        path: bin/*.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: buildozer.log
        retention-days: 7
