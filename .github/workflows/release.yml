name: Build LanPlay Monitor APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: python:3.10-slim

    steps:
    # ===== 1. 拉取代码 =====
    - name: Checkout code
      uses: actions/checkout@v4

    # ===== 2. Java 17 =====
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ===== 3. 系统依赖 =====
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y -qq --no-install-recommends \
            git zip unzip curl wget \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            pngquant ca-certificates

    # ===== 4. 安装 Buildozer + Cython（版本锁定）=====
    - name: Install Buildozer
      run: |
        pip install --upgrade pip setuptools wheel
        # 锁定 Cython 版本（黑屏版本能跑的关键）
        pip install cython==0.29.33
        pip install buildozer==1.5.0
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # ===== 5. 安装 Android SDK + 接受许可 + 安装 API 34 =====
    - name: Setup Android SDK
      run: |
        export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
        echo "=== Accepting licenses ==="
        yes | sdkmanager --licenses 2>&1 | tail -3 || true
        echo "=== Installing API 34 + build-tools ==="
        sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
        echo "=== Done ==="
        sdkmanager --list 2>&1 | grep "platforms;android" | head -5

    # ===== 6. 生成签名 Keystore =====
    - name: Generate keystore
      id: key
      run: |
        keytool -genkey -v \
          -keystore com.lanplay.monitor.keystore \
          -alias com.lanplay.monitor \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=LanPlay, OU=Monitor, O=LanPlay"
        echo "KEY_CREATED=true" >> $GITHUB_OUTPUT

    # ===== 7. 清理 =====
    - name: Clean
      run: |
        rm -rf .buildozer bin/ dist/ *.apk build.log
        mkdir -p bin
        buildozer android clean 2>&1 || true

    # ===== 8. 构建 Debug APK（最稳定）=====
    - name: Build Debug APK
      id: build_apk
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        export BUILDOZER_ALLOW_PLATFORM_EXEC=1

        echo "=== Buildozer version ==="
        buildozer --version

        echo "=== Building Debug APK ==="
        # 用 debug 模式，最稳定，一定能出包
        buildozer android debug 2>&1 | tee build.log

        echo "=== Searching for APK ==="
        # 查找 APK（Buildozer 通常输出到 bin/）
        find bin -name "*.apk" -type f 2>/dev/null | while read f; do
          echo "✅ Found: $f ($(du -h "$f" | cut -f1))"
        done

        # 也搜全盘
        find . -name "*.apk" -type f 2>/dev/null | while read f; do
          echo "✅ Found: $f"
          cp "$f" "bin/$(basename "$f")" 2>/dev/null || true
        done

        if [ -z "$(ls -A bin/*.apk 2>/dev/null)" ]; then
          echo "❌ No APK in bin/!"
          echo "=== Full search ==="
          find . -name "*.apk" 2>/dev/null
          echo "=== build.log tail ==="
          tail -100 build.log
          exit 1
        fi

        echo "=== Final APKs ==="
        ls -lh bin/

    # ===== 9. 签名 APK =====
    - name: Sign APK
      run: |
        APK=$(ls -t bin/*.apk 2>/dev/null | head -1)
        if [ -z "$APK" ]; then
          echo "❌ No APK to sign!"
          exit 1
        fi

        echo "APK: $APK"

        # 找 build-tools
        SDK="$ANDROID_SDK_ROOT"
        BT=$(ls -d $SDK/build-tools/*/ 2>/dev/null | sort | tail -1)

        if [ -z "$BT" ] || [ ! -f "$BT/zipalign" ]; then
          SDK="/usr/local/lib/android/sdk"
          BT=$(ls -d $SDK/build-tools/*/ 2>/dev/null | sort | tail -1)
        fi

        echo "Build tools: $BT"

        if [ -n "$BT" ] && [ -f "$BT/zipalign" ]; then
          ALIGNED="bin/LanPlayMonitor-aligned.apk"
          SIGNED="bin/LanPlayMonitor-1.0.0-release.apk"
          "$BT/zipalign" -v 4 "$APK" "$ALIGNED" 2>&1 || cp "$APK" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$PWD/com.lanplay.monitor.keystore" \
            --ks-key-alias "com.lanplay.monitor" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" "$ALIGNED" 2>&1 && echo "✅ Signed" || echo "⚠️ Sign failed"
        fi

        ls -lh bin/

    # ===== 10. 上传 APK =====
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LanPlay-Monitor-APK
        path: bin/*.apk
        retention-days: 30

    # ===== 11. 上传 Keystore =====
    - name: Upload keystore
      if: steps.key.outputs.KEY_CREATED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: android-keystore
        path: com.lanplay.monitor.keystore
        retention-days: 1

    # ===== 12. 上传日志 =====
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
        retention-days: 7
