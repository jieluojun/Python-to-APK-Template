name: Build Kivy Android APK In Release Mode

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl unzip openjdk-17-jdk libltdl-dev

    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33
        pip install kivy==2.3.0
        pip install kivymd==1.1.1
        pip install python-for-android

    - name: Debug - List repo contents
      run: |
        echo "=== Repository root ==="
        ls -la
        echo ""
        echo "=== Check buildozer.spec exists ==="
        cat buildozer.spec | head -20

    - name: Generate signing key (if not exists)
      id: generate_key
      run: |
        KEYSTORE="com.lanplay.monitor.keystore"
        ALIAS="com.lanplay.monitor"
        if [ ! -f "$KEYSTORE" ]; then
          echo "Creating new keystore..."
          keytool -genkey -v \
            -keystore "$KEYSTORE" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"
          echo "KEY_CREATED=true" >> $GITHUB_OUTPUT
        else
          echo "Using existing keystore."
          echo "KEY_CREATED=false" >> $GITHUB_OUTPUT
        fi

    - name: Build APK with Buildozer (Release)
      run: |
        export PATH="$HOME/.local/bin:$PATH"

        echo "=== Environment Check ==="
        java -version 2>&1
        python --version
        which buildozer
        buildozer --version 2>&1 || true

        export BUILDOZER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0

        # p4a 签名环境变量
        export P4A_RELEASE_KEYSTORE="$PWD/com.lanplay.monitor.keystore"
        export P4A_RELEASE_KEYALIAS="com.lanplay.monitor"
        export P4A_RELEASE_KEYSTORE_PASSWD="android"
        export P4A_RELEASE_KEYALIAS_PASSWD="android"

        # 清理旧构建
        buildozer android clean 2>&1 | tee clean.log || true

        echo "=== Starting release build ==="
        # 正式打包 release APK
        buildozer -v android release 2>&1 | tee buildozer.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        echo "Build exit code: $BUILD_EXIT_CODE"

        echo "=== Searching for APK/AAB recursively ==="
        find . -name "*.apk" -o -name "*.aab" 2>/dev/null | while read f; do
          echo "Found: $f ($(du -h "$f" | cut -f1))"
        done

        # 复制到根目录和 bin/
        mkdir -p bin
        find . -name "*.apk" -exec cp -v {} ./bin/ \; 2>/dev/null || true
        find . -name "*.aab" -exec cp -v {} ./bin/ \; 2>/dev/null || true
        find . -name "*.apk" -exec cp -v {} ./ \; 2>/dev/null || true
        find . -name "*.aab" -exec cp -v {} ./ \; 2>/dev/null || true

        echo "=== bin/ contents ==="
        ls -la bin/ 2>/dev/null || echo "bin/ not found"

    - name: Check if APK/AAB was built
      id: check-build
      run: |
        echo "=== Checking for build artifacts ==="
        ls -la *.apk *.aab bin/ 2>/dev/null || true

        if ls bin/*.apk 1>/dev/null 2>&1 || ls bin/*.aab 1>/dev/null 2>&1; then
          echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
          echo "=== Built files in bin/ ==="
          ls -la bin/
        elif ls *.apk 1>/dev/null 2>&1 || ls *.aab 1>/dev/null 2>&1; then
          echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
          echo "=== Built files in root ==="
          ls -la *.apk *.aab
        else
          echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
          echo "❌ No APK/AAB found!"
          echo "=== Full .buildozer tree (last 30 lines) ==="
          find .buildozer -type f 2>/dev/null | tail -30 || true
          echo "=== buildozer.log tail ==="
          tail -50 buildozer.log 2>/dev/null || echo "No buildozer.log"
        fi

    - name: Upload APK/AAB artifact
      if: steps.check-build.outputs.BUILD_FINAL_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kivy-app-build
        path: |
          bin/*.apk
          bin/*.aab
          *.apk
          *.aab
        retention-days: 30

    - name: Upload signing key (if newly created)
      if: steps.generate_key.outputs.KEY_CREATED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: android-keystore
        path: com.lanplay.monitor.keystore
        retention-days: 1

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          buildozer.log
          clean.log
        retention-days: 7
