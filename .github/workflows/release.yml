name: Build Kivy Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java.home=/usr/lib/jvm/temurin-17-jdk-amd64 -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          openjdk-17-jdk \
          autoconf automake libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          python3-pip curl

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Cython==0.29.33
        pip install buildozer
        pip install python-for-android
        pip install kivy==2.3.0
        pip install https://github.com/kivymd/KivyMD/archive/master.zip

    - name: Create signing keystore (if not exists)
      run: |
        if [ ! -f "com.lanplay.monitor.keystore" ]; then
          keytool -genkeypair \
            -keystore com.lanplay.monitor.keystore \
            -alias com.lanplay.monitor \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=LanPlay, OU=Release, O=LAN, L=Unknown, ST=Unknown, C=US"
        fi

    - name: Build Release APK
      run: |
        export BUILDOZER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0

        buildozer -v android release

    - name: Find generated APK
      id: apk
      run: |
        mkdir -p output
        APK=$(find .buildozer -name "*-release.apk" | head -n 1)
        if [ -z "$APK" ]; then
          echo "❌ APK not found"
          exit 1
        fi
        cp "$APK" output/LanPlayMonitor-release.apk
        echo "APK_PATH=output/LanPlayMonitor-release.apk" >> $GITHUB_OUTPUT

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LanPlayMonitor-Release-APK
        path: ${{ steps.apk.outputs.APK_PATH }}
        retention-days: 30

    - name: Upload build logs (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-logs
        path: |
          buildozer.log
          .buildozer/android/platform/build-*/
        retention-days: 7
