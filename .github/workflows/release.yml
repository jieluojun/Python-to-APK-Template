name: Build Kivy Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    # ===== 1. 拉取代码 =====
    - name: Checkout code
      uses: actions/checkout@v4

    # ===== 2. Java 17 =====
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ===== 3. 安装系统依赖 + Docker =====
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip curl \
            python3-pip pngquant

    # ===== 4. 生成签名 Keystore =====
    - name: Generate signing key
      id: generate_key
      run: |
        KEYSTORE="com.lanplay.monitor.keystore"
        ALIAS="com.lanplay.monitor"
        keytool -genkey -v \
          -keystore "$KEYSTORE" \
          -alias "$ALIAS" \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=LanPlay, OU=Monitor, O=LanPlay, L=Unknown, ST=Unknown, C=Unknown"
        echo "KEY_CREATED=true" >> $GITHUB_OUTPUT

    # ===== 5. 清理旧构建 =====
    - name: Clean old builds
      run: |
        rm -rf .buildozer bin/ release.log
        mkdir -p bin

    # ===== 6. 用 Docker 构建 APK（核心）=====
    - name: Build APK with p4a Docker
      id: build_apk
      run: |
        echo "=== Pulling p4a Docker image ==="
        docker pull kivy/python-for-android:latest

        echo "=== Running Docker build ==="
        docker run --rm \
          -v "$PWD":/app \
          -w /app \
          -e ANDROID_SDK_ROOT=/opt/android-sdk \
          -e ANDROID_HOME=/opt/android-sdk \
          kivy/python-for-android:latest \
          bash -c "
            set -e
            echo '=== Installing Python deps ==='
            pip install kivy==2.3.0 pyjnius==1.4.2 --no-deps 2>&1 | tail -5 || true

            echo '=== Generating keystore in container ==='
            keytool -genkey -v \
              -keystore /app/com.lanplay.monitor.keystore \
              -alias com.lanplay.monitor \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname 'CN=LanPlay, OU=Monitor, O=LanPlay'

            echo '=== Running p4a build ==='
            p4a --storage-dir=/app/.buildozer \
                apk \
                --requirements=python3,kivy,pyjnius,libiconv,libffi \
                --private=/app \
                --package=com.lanplay.monitor \
                --name=LanPlayMonitor \
                --version=1.0.0 \
                --orientation=portrait \
                --permission=INTERNET \
                --window \
                --enable-androidx \
                --android-api=33 \
                --ndk=25b \
                2>&1 | tee /app/release.log

            echo '=== APKs in container ==='
            find /app -name '*.apk' -type f
          "

        echo "=== Checking APK on host ==="
        find . -name "*.apk" -type f | while read f; do
          echo "✅ $f ($(du -h "$f" | cut -f1))"
          cp "$f" "bin/$(basename "$f")"
        done

        if [ -z "$(ls -A bin/ 2>/dev/null)" ]; then
          echo "❌ No APK found after Docker build!"
          echo "=== .buildozer contents ==="
          find .buildozer -type f 2>/dev/null | head -30 || echo "(empty)"
          echo "=== release.log tail ==="
          tail -50 release.log 2>/dev/null || echo "(no log)"
          exit 1
        fi

        echo "✅ bin/ contents:"
        ls -lh bin/

    # ===== 7. 签名 APK =====
    - name: Sign APK
      run: |
        APK=$(ls -t bin/*.apk 2>/dev/null | head -1)
        if [ -z "$APK" ]; then
          echo "❌ No APK to sign!"
          exit 1
        fi

        echo "APK to sign: $APK"

        # 查找 zipalign 和 apksigner（在 Docker 容器里也有）
        docker run --rm \
          -v "$PWD":/app \
          -w /app \
          kivy/python-for-android:latest \
          bash -c "
            # 用 Android SDK 里的工具签名
            SDK=/opt/android-sdk
            BUILD_TOOLS=\$(ls -d \$SDK/build-tools/*/ 2>/dev/null | sort | tail -1)
            echo \"Build tools: \$BUILD_TOOLS\"

            if [ -f \"\$BUILD_TOOLS/zipalign\" ] && [ -f \"\$BUILD_TOOLS/apksigner\" ]; then
              echo '=== Zipalign ==='
              \$BUILD_TOOLS/zipalign -v 4 /app/$APK /app/bin/LanPlayMonitor-1.0.0-aligned.apk

              echo '=== Sign ==='
              \$BUILD_TOOLS/apksigner sign \
                --ks /app/com.lanplay.monitor.keystore \
                --ks-key-alias com.lanplay.monitor \
                --ks-pass pass:android \
                --key-pass pass:android \
                --out /app/bin/LanPlayMonitor-1.0.0-release.apk \
                /app/bin/LanPlayMonitor-1.0.0-aligned.apk

              echo '✅ Signed APK created'
              ls -lh /app/bin/LanPlayMonitor-1.0.0-release.apk
            else
              echo '⚠️ No build-tools found in Docker, trying host...'
              ls -la \$SDK/build-tools/ 2>/dev/null || echo 'No SDK on host'
            fi
          "

        # 检查宿主机是否有 build-tools
        if [ ! -f "bin/LanPlayMonitor-1.0.0-release.apk" ]; then
          SDK="/usr/local/lib/android/sdk"
          BUILD_TOOLS=$(ls -d $SDK/build-tools/*/ 2>/dev/null | sort | tail -1)
          if [ -n "$BUILD_TOOLS" ]; then
            echo "=== Using host build-tools: $BUILD_TOOLS ==="
            "$BUILD_TOOLS/zipalign" -v 4 "$APK" "bin/LanPlayMonitor-1.0.0-aligned.apk" 2>&1 || cp "$APK" "bin/LanPlayMonitor-1.0.0-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$PWD/com.lanplay.monitor.keystore" \
              --ks-key-alias "com.lanplay.monitor" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "bin/LanPlayMonitor-1.0.0-release.apk" \
              "bin/LanPlayMonitor-1.0.0-aligned.apk" 2>&1 || true
          fi
        fi

        echo "=== Final bin/ ==="
        ls -lh bin/

    # ===== 8. 上传 APK =====
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kivy-android-apk
        path: bin/*.apk
        retention-days: 30

    # ===== 9. 上传 Keystore =====
    - name: Upload keystore
      if: steps.generate_key.outputs.KEY_CREATED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: android-keystore
        path: com.lanplay.monitor.keystore
        retention-days: 1

    # ===== 10. 上传日志 =====
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          release.log
        retention-days: 7
