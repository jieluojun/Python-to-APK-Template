name: Build Kivy Android APK (Signed Release)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.java-home=$JAVA_HOME -Dorg.gradle.jvmargs=-Xmx4096m"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl unzip openjdk-17-jdk libltdl-dev

    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy kivymd
        pip install python-for-android

    # ✅ 解码 keystore（固定绝对路径）
    - name: Decode Keystore
      run: |
        mkdir -p /home/runner/keystore
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /home/runner/keystore/release.keystore
        ls -la /home/runner/keystore/release.keystore

    # ✅ 提前校验 keystore（密码/alias 错立刻失败）
    - name: Verify Keystore
      run: |
        keytool -list \
          -keystore /home/runner/keystore/release.keystore \
          -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWD }}" \
          -alias "${{ secrets.RELEASE_KEYALIAS }}"

    # ✅ 导出 P4A 签名变量（Buildozer 唯一认的这一组）
    - name: Export signing env vars
      run: |
        echo "P4A_RELEASE_KEYSTORE=/home/runner/keystore/release.keystore" >> $GITHUB_ENV
        echo "P4A_RELEASE_KEYALIAS=${{ secrets.RELEASE_KEYALIAS }}" >> $GITHUB_ENV
        echo "P4A_RELEASE_KEYSTORE_PASSWD=${{ secrets.RELEASE_KEYSTORE_PASSWD }}" >> $GITHUB_ENV
        echo "P4A_RELEASE_KEYALIAS_PASSWD=${{ secrets.RELEASE_KEYALIAS_PASSWD }}" >> $GITHUB_ENV

    - name: Build Signed Release APK
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        echo "Java version:"
        java -version
        echo "Python version:"
        python --version
        buildozer --version

        export BUILDODER_ALLOW_PLATFORM_EXEC=1
        export USE_COLORS=0

        buildozer -v android release 2>&1 | tee buildozer.log

        echo "=== APK SEARCH ==="
        find . -type f -name "*.apk" | tee apk-list.txt
        mkdir -p bin
        find . -type f -name "*.apk" -exec cp {} bin/ \;
        ls -la bin/

    - name: Check if APK was built
      id: check-build
      run: |
        if ls bin/*.apk 1> /dev/null 2>&1; then
          echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
          ls -la bin/*.apk
        else
          echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_ENV
        fi

    - name: Upload APK artifact
      if: steps.check-build.outputs.BUILD_FINAL_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kivy-app-release-apk
        path: bin/*.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: buildozer.log
        retention-days: 7